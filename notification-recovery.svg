<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 763" width="1430" height="763" role="img" aria-label="Lost notification · Find the saved message in PostgreSQL">
  <title>Lost notification · Find the saved message in PostgreSQL</title>
  <desc>The API saved the message, but could not notify RabbitMQ. A free processor can still find and handle it.</desc>
  <rect x="0" y="0" width="1430" height="763" rx="0" fill="#f5f8fa" stroke="none" stroke-width="1" />
  <text x="40" y="56" fill="#172e3b" font-size="35" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Lost notification · Find the saved message in PostgreSQL</text>
  <text x="42" y="89" fill="#466072" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The API saved the message, but could not notify RabbitMQ. A free processor can still find and handle it.</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#557383" />
    </marker>
  </defs>
  <rect x="40" y="123" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <rect x="40" y="320" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <rect x="40" y="517" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <polyline points="468.6666666666667,214.5 508.6666666666667,214.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-commit" data-to="rec-fail" data-kind="flow" />
  <polyline points="921.3333333333334,214.5 961.3333333333334,214.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-fail" data-to="rec-accept" data-kind="flow" />
  <polyline points="1167.6666666666667,264 1167.6666666666667,313.0 262.33333333333337,313.0 262.33333333333337,362" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-accept" data-to="rec-slot" data-kind="async" stroke-dasharray="6 5" />
  <polyline points="468.6666666666667,411.5 508.6666666666667,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-slot" data-to="rec-claim" data-kind="flow" />
  <polyline points="715.0,461 715.0,510.0 262.33333333333337,510.0 262.33333333333337,559" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-claim" data-to="rec-booking" data-kind="flow" />
  <polyline points="468.6666666666667,608.5 508.6666666666667,608.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-booking" data-to="rec-redis" data-kind="flow" />
  <polyline points="715.0,559 715.0,510.0 1167.6666666666667,510.0 1167.6666666666667,461" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-redis" data-to="rec-finish" data-kind="flow" />
  <polyline points="1167.6666666666667,461 1167.6666666666667,510.0 1167.6666666666667,510.0 1167.6666666666667,559" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="rec-finish" data-to="rec-send" data-kind="async" stroke-dasharray="6 5" />
  <rect x="55" y="131" width="343" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="149" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Save the message before notifying RabbitMQ</text>
  <g id="rec-commit" data-source="app/channels/telegram_intake.py#save_update">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_intake.py#L48">
      <title>save_update · app/channels/telegram_intake.py:48</title>
      <rect x="56.0" y="165" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="68.0" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Save the incoming message</text>
      <text x="68.0" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_intake.py:48</text>
      <text x="68.0" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The API saves the supported update and creates the chat</text>
      <text x="68.0" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">record if needed.</text>
    </a>
  </g>
  <g id="rec-fail" data-source="app/channels/telegram_queue.py#TelegramQueue.try_publish">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_queue.py#L117">
      <title>TelegramQueue.try_publish · app/channels/telegram_queue.py:117</title>
      <rect x="508.6666666666667" y="165" width="412.6666666666667" height="99" rx="12" fill="#fff0eb" stroke="#bd6959" stroke-width="1.4" />
      <text x="520.6666666666667" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">RabbitMQ notification fails</text>
      <text x="520.6666666666667" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_queue.py:117</text>
      <text x="520.6666666666667" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The API cannot confirm the bot/chat notification within</text>
      <text x="520.6666666666667" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">its deadline.</text>
    </a>
  </g>
  <g id="rec-accept" data-source="app/main.py#telegram_webhook">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/main.py#L101">
      <title>telegram_webhook · app/main.py:101</title>
      <rect x="961.3333333333334" y="165" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="973.3333333333334" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Confirm receipt to Telegram</text>
      <text x="973.3333333333334" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">main.py:101</text>
      <text x="973.3333333333334" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Return HTTP 204 to report successful receipt. The saved</text>
      <text x="973.3333333333334" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">message still awaits processing.</text>
    </a>
  </g>
  <rect x="55" y="328" width="343" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="346" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">A free processor finds the waiting message</text>
  <g id="rec-slot" data-source="app/telegram_worker.py#process_pending">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/telegram_worker.py#L105">
      <title>process_pending · app/telegram_worker.py:105</title>
      <rect x="56.0" y="362" width="412.6666666666667" height="99" rx="12" fill="#ffffff" stroke="#c8d7df" stroke-width="1.4" />
      <text x="68.0" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Check while the processor is free</text>
      <text x="68.0" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_worker.py:105</text>
      <text x="68.0" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">A processor checks at startup and about one second</text>
      <text x="68.0" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">after each recovery check or recovered message</text>
      <text x="68.0" y="454" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">finishes.</text>
    </a>
  </g>
  <g id="rec-claim" data-source="app/channels/telegram_turns.py#TelegramTurns.claim_next">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_turns.py#L112">
      <title>TelegramTurns.claim_next · app/channels/telegram_turns.py:112</title>
      <rect x="508.6666666666667" y="362" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="520.6666666666667" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Take a pending chat message</text>
      <text x="520.6666666666667" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_turns.py:112</text>
      <text x="520.6666666666667" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">PostgreSQL finds an eligible message and grants one</text>
      <text x="520.6666666666667" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">processor temporary permission to handle its chat.</text>
    </a>
  </g>
  <g id="rec-finish" data-source="app/channels/telegram_turns.py#TelegramTurns.finish">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_turns.py#L296">
      <title>TelegramTurns.finish · app/channels/telegram_turns.py:296</title>
      <rect x="961.3333333333334" y="362" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="973.3333333333334" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Save the reply and completed status</text>
      <text x="973.3333333333334" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_turns.py:296</text>
      <text x="973.3333333333334" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Save completion, any reply and the reference to Redis</text>
      <text x="973.3333333333334" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">state together, then release the chat.</text>
    </a>
  </g>
  <rect x="55" y="525" width="487" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="543" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">A booking, conversation state and reply are saved separately</text>
  <g id="rec-booking" data-source="app/booking.py#BookingService.create">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/booking.py#L149">
      <title>BookingService.create · app/booking.py:149</title>
      <rect x="56.0" y="559" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="68.0" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Save an authorized booking</text>
      <text x="68.0" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">booking.py:149</text>
      <text x="68.0" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">If the customer approved a booking, save it together</text>
      <text x="68.0" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">with a record that identifies retries of this request.</text>
    </a>
  </g>
  <g id="rec-redis" data-source="app/graph/redis_checkpoint.py#RedisCheckpointSaver">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/graph/redis_checkpoint.py#L31">
      <title>RedisCheckpointSaver · app/graph/redis_checkpoint.py:31</title>
      <rect x="508.6666666666667" y="559" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="520.6666666666667" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Save conversation progress in Redis</text>
      <text x="520.6666666666667" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">redis_checkpoint.py:31</text>
      <text x="520.6666666666667" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Redis stores the conversation draft, offered times and</text>
      <text x="520.6666666666667" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">a limited history with recognized sensitive details</text>
      <text x="520.6666666666667" y="651" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">removed.</text>
    </a>
  </g>
  <g id="rec-send" data-source="app/telegram_sender.py#run_sender">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/telegram_sender.py#L43">
      <title>run_sender · app/telegram_sender.py:43</title>
      <rect x="961.3333333333334" y="559" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="973.3333333333334" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Send the saved reply separately</text>
      <text x="973.3333333333334" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_sender.py:43</text>
      <text x="973.3333333333334" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The sender reads the PostgreSQL reply and calls</text>
      <text x="973.3333333333334" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Telegram after the processor has saved it.</text>
    </a>
  </g>
  <text x="42" y="735" fill="#466072" font-size="14" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Saving the incoming message, saving a booking and completing processing use separate database transactions. Redis, RabbitMQ and Telegram are separate systems.</text>
</svg>