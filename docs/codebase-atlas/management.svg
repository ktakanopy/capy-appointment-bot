      <text x="747.0" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">A later turn matches the number to the</text>
      <text x="747.0" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">saved offer and prepares the move.</text>
