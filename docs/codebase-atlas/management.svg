  <rect x="55" y="328" width="199" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="346" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Customer moves a booking</text>
  <g id="move" data-source="app/main.py#telegram_webhook">
    <a href="../../app/main.py#L101">
      <title>telegram_webhook · app/main.py:101</title>
      <rect x="56.0" y="362" width="299.5" height="99" rx="12" fill="#e5f3fc" stroke="#397a9e" stroke-width="1.4" />
      <text x="68.0" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">“Move my appointment”</text>
