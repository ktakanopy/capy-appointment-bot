<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 566" width="1430" height="566" role="img" aria-label="Manage an existing booking">
  <title>Manage an existing booking</title>
  <desc>Follow cancellation and rescheduling through the customer-scoped graph and the PostgreSQL write boundary.</desc>
  <rect x="0" y="0" width="1430" height="566" rx="0" fill="#f5f8fa" stroke="none" stroke-width="1" />
  <text x="40" y="56" fill="#172e3b" font-size="35" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Manage an existing booking</text>
