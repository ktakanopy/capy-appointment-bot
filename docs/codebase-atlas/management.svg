  <polyline points="695.0,411.5 735.0,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="prepare-move" data-to="choose-move" data-kind="async" stroke-dasharray="6 5" />
  <polyline points="1034.5,411.5 1074.5,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="choose-move" data-to="commit-move" data-kind="flow" />
