      <text x="407.5" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">steps.py:797</text>
      <text x="407.5" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Resolve an upcoming owned booking and</text>
      <text x="407.5" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">search for replacement slots.</text>
    </a>
  </g>
  <g id="choose-move" data-source="app/graph/steps.py#select">
    <a href="../../app/graph/steps.py#L733">
      <title>select · app/graph/steps.py:733</title>
