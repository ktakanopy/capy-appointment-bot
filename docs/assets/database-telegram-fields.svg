<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="342" viewBox="0 0 1170 342" role="img" aria-labelledby="title desc">
  <title id="title">Telegram table fields</title>
  <desc id="desc">Three PostgreSQL tables with their columns and primary and foreign keys.</desc>
  <style>
text {font-family:Inter,Arial,sans-serif; fill:#19362d}
.title {font-size:28px;font-weight:700}
.subtitle {font-size:15px;fill:#536d60}
.name {font:700 16px ui-monospace,Menlo,monospace;fill:#173f32}
.field {font:14px ui-monospace,Menlo,monospace;fill:#314a40}
.key {font-size:13px;font-weight:700;fill:#5e6e91}
</style>
  <rect width="1170" height="342" rx="20" fill="#fbfaf5"/>
  <text x="30" y="44" class="title">Telegram tables and fields</text>
  <text x="30" y="70" class="subtitle">PK  primary key    ·    FK  foreign key    ·    Composite keys include all marked fields</text>
  <rect x="30" y="100" width="350" height="207" rx="12" fill="#fffefa" stroke="#aec3b2"/>
  <rect x="30" y="100" width="350" height="42" rx="12" fill="#e8f2e8"/>
  <text x="46" y="127" class="name">telegram_inbox</text>
  <text x="46" y="162" class="field">PK  bot_id · update_id</text>
  <text x="46" y="184" class="field">FK  business_id</text>
  <text x="46" y="206" class="field">chat_id · telegram_user_id</text>
  <text x="46" y="228" class="field">status · payload</text>
  <text x="46" y="250" class="field">attempts · last_error</text>
  <text x="46" y="272" class="field">received_at · expires_at</text>
  <text x="46" y="294" class="field">message_date · ready_at</text>
  <rect x="410" y="100" width="350" height="207" rx="12" fill="#fffefa" stroke="#aec3b2"/>
  <rect x="410" y="100" width="350" height="42" rx="12" fill="#e8f2e8"/>
  <text x="426" y="127" class="name">telegram_chat_processing_state</text>
  <text x="426" y="162" class="field">PK bot_id</text>
  <text x="426" y="184" class="field">PK  chat_id</text>
  <text x="426" y="206" class="field">FK  business_id</text>
  <text x="426" y="228" class="field">generation · active_update_id</text>
  <text x="426" y="250" class="field">lease_until · last_claimed_at</text>
  <text x="426" y="272" class="field">last_message_date</text>
  <text x="426" y="294" class="field">last_update_id · checkpoint_thread</text>
  <rect x="790" y="100" width="350" height="185" rx="12" fill="#fffefa" stroke="#aec3b2"/>
  <rect x="790" y="100" width="350" height="42" rx="12" fill="#e8f2e8"/>
  <text x="806" y="127" class="name">telegram_outbox</text>
  <text x="806" y="162" class="field">PK  id</text>
  <text x="806" y="184" class="field">FK  business_id  ·  bot_id (lookup)</text>
  <text x="806" y="206" class="field">chat_id · update_id</text>
  <text x="806" y="228" class="field">message · reply_markup · status</text>
  <text x="806" y="250" class="field">attempts · ready_at · lease_until</text>
  <text x="806" y="272" class="field">created_at · finished_at · last_error</text>
</svg>
