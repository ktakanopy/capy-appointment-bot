<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="823" viewBox="0 0 1120 823" role="img" aria-labelledby="title description">
  <title id="title">How the Telegram worker works</title>
  <desc id="description">At startup the worker validates its Telegram bot, acquires a PostgreSQL lock, recovers interrupted updates and restores the saved polling offset. In each loop it attempts to send saved replies, claims received updates, runs scheduling turns and saves the replies. It attempts delivery again, prunes expired completed receipts, polls for new messages and saves each update with the next offset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#365f51"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 32px; font-weight: 700; }
    .caption { font-size: 15px; fill: #426057; }
    .actor { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .heading { font-size: 19px; font-weight: 700; }
    .message { font-size: 16px; text-anchor: middle; }
    .over-lifeline { paint-order: stroke; stroke: #f1f4eb; stroke-width: 5px; stroke-linejoin: round; }
    .call-id { fill: #275343; font-weight: 700; }
    .lifeline { fill: none; stroke: #9aad9f; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #365f51; stroke-width: 1.8; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
  </style>

  <rect width="1120" height="823" rx="20" fill="#fbfaf5"/>
  <text class="title" x="28" y="49">How the Telegram worker works</text>
  <text class="caption" x="28" y="76">Solid arrows show requests or writes. Dashed arrows show results.</text>

  <rect x="28" y="160" width="1064" height="136" rx="13" fill="#e4efdf" stroke="#8baa86"/>
  <rect x="28" y="309" width="1064" height="459" rx="13" fill="#f1f4eb"/>

  <path class="lifeline" d="M115 144V752 M397 144V752 M727 144V752 M1000 144V752"/>
  <rect x="37" y="97" width="156" height="47" rx="9" fill="#fbefd5" stroke="#c5a268"/>
  <rect x="306" y="97" width="182" height="47" rx="9" fill="#e4efdf" stroke="#8baa86"/>
  <rect x="648" y="97" width="158" height="47" rx="9" fill="#e4eff0" stroke="#8ba8ac"/>
  <rect x="910" y="97" width="180" height="47" rx="9" fill="#e4efdf" stroke="#8baa86"/>
  <text class="actor" x="115" y="127">Telegram API</text>
  <text class="actor" x="397" y="127">Telegram worker</text>
  <text class="actor" x="727" y="127">PostgreSQL</text>
  <text class="actor" x="1000" y="127">LangGraph</text>

  <text class="heading" x="47" y="188">Startup</text>
  <path class="arrow" d="M397 219H117"/>
  <text class="message" x="256" y="212"><tspan class="call-id">T01</tspan> Get bot ID and check webhook</text>
  <path class="arrow" d="M397 252H725"/>
  <text class="message" x="562" y="245"><tspan class="call-id">T02</tspan> Verify business and acquire bot lock</text>
  <path class="arrow" d="M397 283H725"/>
  <text class="message" x="562" y="276"><tspan class="call-id">T03</tspan> Recover turns and restore offset</text>

  <text class="heading" x="47" y="337">Each loop</text>
  <path class="arrow" d="M397 365H725"/>
  <text class="message" x="562" y="358"><tspan class="call-id">T04</tspan> Read oldest waiting reply</text>
  <path class="arrow" d="M397 400H117"/>
  <text class="message" x="256" y="393"><tspan class="call-id">T05</tspan> Send saved reply if due</text>
  <path class="arrow" d="M397 435H725"/>
  <text class="message" x="562" y="428"><tspan class="call-id">T06</tspan> Complete, discard or defer reply</text>
  <path class="arrow" d="M397 470H725"/>
  <text class="message" x="562" y="463"><tspan class="call-id">T07</tspan> Read and claim queued updates</text>
  <path class="arrow" d="M397 505H998"/>
  <text class="message over-lifeline" x="698" y="498"><tspan class="call-id">T08</tspan> Run one turn per scheduling message</text>
  <path class="arrow reply" d="M1000 540H399"/>
  <text class="message over-lifeline" x="698" y="533"><tspan class="call-id">T09</tspan> Return reply text</text>
  <path class="arrow" d="M397 575H725"/>
  <text class="message" x="562" y="568"><tspan class="call-id">T10</tspan> Save reply and clear payload</text>

  <rect x="422" y="591" width="500" height="31" rx="7" fill="#fbefd5" stroke="#c5a268"/>
  <text class="caption" x="435" y="612">Repeat T04–T06 after processing the queued updates.</text>

  <path class="arrow" d="M397 653H725"/>
  <text class="message" x="562" y="646"><tspan class="call-id">T11</tspan> Remove expired completed receipts</text>
  <path class="arrow" d="M397 688H117"/>
  <text class="message" x="256" y="681"><tspan class="call-id">T12</tspan> Poll from the saved offset</text>
  <path class="arrow reply" d="M115 723H395"/>
  <text class="message" x="256" y="716"><tspan class="call-id">T13</tspan> Return incoming updates</text>
  <path class="arrow" d="M397 753H725"/>
  <text class="message" x="562" y="746"><tspan class="call-id">T14</tspan> Save each update with its next offset</text>

  <text class="caption" x="47" y="799">The next loop claims newly saved updates at T07.</text>
</svg>
