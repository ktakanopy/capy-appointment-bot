<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Follow one message across services</title>
  <desc id="desc">The three services can log the same pair of identifiers. In this example, bot_id is 42 and update_id is 120. L1 connects receipt in the API to the claim in the worker. L2 connects the queued reply to the sender outcome.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 29px; font-weight: 700; }
    .heading { font-size: 21px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; fill: #35544a; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
    .panel { fill: #fffefa; stroke: #a4b8a8; }
    .green { fill: #eaf2e5; stroke: #86a57e; }
    .arrow { fill: none; stroke: #537568; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="720" height="412" rx="20" fill="#fbfaf5"/>
  <text class="title" x="30" y="46">Follow one message across services</text>
  <text class="code" x="30" y="74">Example filter · bot_id = 42 · update_id = 120</text>
  <rect class="panel" x="30" y="96" width="660" height="59" rx="13"/>
  <text class="heading" x="52" y="133">api</text>
  <text class="code" x="259" y="133">telegram.inbox.recorded</text>
  <path class="arrow" d="M68 156V201m-6-7 6 7 6-7"/>
  <text class="label" x="91" y="184">L1 · From API to worker</text>
  <rect class="green" x="30" y="202" width="660" height="78" rx="13"/>
  <text class="heading" x="52" y="247">telegram-worker</text>
  <text class="code" x="259" y="234">telegram.turn.claimed</text>
  <text class="code" x="259" y="260">telegram.turn.saved</text>
  <path class="arrow" d="M68 281V326m-6-7 6 7 6-7"/>
  <text class="label" x="91" y="309">L2 · From worker to sender</text>
  <rect class="panel" x="30" y="327" width="660" height="61" rx="13"/>
  <text class="heading" x="52" y="365">telegram-sender</text>
  <text class="code" x="259" y="365">telegram.outbox.result</text>
</svg>
