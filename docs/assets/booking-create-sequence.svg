<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="928" viewBox="0 0 1120 928" role="img" aria-labelledby="title description">
  <title id="title">Find a time and create a booking</title>
  <desc id="description">The customer requests times in Telegram. The worker records the update and resolves the customer, then runs a workflow turn. The scheduling services read availability from PostgreSQL. The worker saves and sends the offered times. The customer chooses a slot in a second update. The workflow resolves the choice, and the booking service verifies the retry key, slot and customer. It writes the booking, pending reminder and retry record in one transaction. The worker saves and sends the reply after commit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#365f51"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 32px; font-weight: 700; }
    .caption { font-size: 15px; fill: #426057; }
    .actor { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .phase { font-size: 19px; font-weight: 700; }
    .message { font-size: 16px; text-anchor: middle; }
    .call-id { fill: #275343; font-weight: 700; }
    .over-lifelines { paint-order: stroke; stroke: #f1f4eb; stroke-width: 5px; stroke-linejoin: round; }
    .lifeline { fill: none; stroke: #9aad9f; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #365f51; stroke-width: 1.8; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
  </style>

  <rect width="1120" height="928" rx="20" fill="#fbfaf5"/>
  <text class="title" x="28" y="49">Find a time and create a booking</text>
  <text class="caption" x="28" y="76">Two Telegram turns. Solid arrows show requests or writes. Dashed arrows show results or replies.</text>

  <rect x="28" y="160" width="1064" height="304" rx="13" fill="#f1f4eb"/>
  <rect x="28" y="476" width="1064" height="424" rx="13" fill="#f1f4eb"/>
  <rect x="668" y="634" width="412" height="157" rx="10" fill="#e4efdf" stroke="#8baa86"/>

  <path class="lifeline" d="M108 144V890 M303 144V890 M509 144V890 M744 144V890 M1008 144V890"/>
  <g fill="#e4efdf" stroke="#8baa86">
    <rect x="33" y="97" width="150" height="47" rx="9"/>
    <rect x="216" y="97" width="174" height="47" rx="9"/>
    <rect x="416" y="97" width="186" height="47" rx="9"/>
    <rect x="645" y="97" width="198" height="47" rx="9"/>
  </g>
  <rect x="929" y="97" width="158" height="47" rx="9" fill="#e4eff0" stroke="#8ba8ac"/>
  <text class="actor" x="108" y="127">Customer</text>
  <text class="actor" x="303" y="127">Telegram worker</text>
  <text class="actor" x="509" y="127">LangGraph workflow</text>
  <text class="actor" x="744" y="127">Scheduling services</text>
  <text class="actor" x="1008" y="127">PostgreSQL</text>

  <text class="phase" x="46" y="188">Find a time</text>
  <path class="arrow" d="M108 220H301"/>
  <text class="message" x="205" y="214"><tspan class="call-id">C01</tspan> Ask for times</text>
  <path class="arrow" d="M303 252H1006"/>
  <text class="message over-lifelines" x="655" y="246"><tspan class="call-id">C02</tspan> Save and claim the update, then resolve the customer</text>
  <path class="arrow" d="M303 284H507"/>
  <text class="message" x="406" y="278"><tspan class="call-id">C03</tspan> Run the search turn</text>
  <path class="arrow" d="M509 316H742"/>
  <text class="message" x="626" y="310"><tspan class="call-id">C04</tspan> Find available slots</text>
  <path class="arrow" d="M744 348H1006"/>
  <text class="message" x="876" y="342"><tspan class="call-id">C05</tspan> Read hours and conflicts</text>
  <path class="arrow reply" d="M744 380H511"/>
  <text class="message" x="626" y="374"><tspan class="call-id">C06</tspan> Return available slots</text>
  <path class="arrow reply" d="M509 380H305"/>
  <text class="message" x="406" y="374"><tspan class="call-id">C07</tspan> Return slot choices</text>
  <path class="arrow" d="M303 412H1006"/>
  <text class="message" x="655" y="406"><tspan class="call-id">C08</tspan> Save the slot reply</text>
  <path class="arrow reply" d="M303 444H110"/>
  <text class="message" x="205" y="438"><tspan class="call-id">C09</tspan> Send offered times</text>

  <text class="phase" x="46" y="504">Create the booking</text>
  <path class="arrow" d="M108 536H301"/>
  <text class="message" x="205" y="530"><tspan class="call-id">C10</tspan> Choose a time</text>
  <path class="arrow" d="M303 568H1006"/>
  <text class="message over-lifelines" x="655" y="562"><tspan class="call-id">C11</tspan> Save and claim the new update, then resolve the customer</text>
  <path class="arrow" d="M303 600H507"/>
  <text class="message" x="406" y="594"><tspan class="call-id">C12</tspan> Run the selection turn</text>
  <path class="arrow" d="M509 626H742"/>
  <text class="message" x="626" y="620"><tspan class="call-id">C13</tspan> Book the selected slot</text>

  <text class="phase" x="681" y="657">Booking transaction</text>
  <path class="arrow" d="M744 689H1006"/>
  <text class="message" x="876" y="683"><tspan class="call-id">C14</tspan> Lock business and check key</text>
  <path class="arrow" d="M744 720H1006"/>
  <text class="message" x="876" y="714"><tspan class="call-id">C15</tspan> Recheck slot and customer</text>
  <path class="arrow" d="M744 751H1006"/>
  <text class="message" x="876" y="745"><tspan class="call-id">C16</tspan> Write booking, job and result</text>
  <path class="arrow" d="M744 781H1006"/>
  <text class="message" x="876" y="775"><tspan class="call-id">C17</tspan> Commit</text>

  <path class="arrow reply" d="M744 820H511"/>
  <text class="message" x="626" y="814"><tspan class="call-id">C18</tspan> Return created booking</text>
  <path class="arrow reply" d="M509 820H305"/>
  <text class="message" x="406" y="814"><tspan class="call-id">C19</tspan> Return booking reply</text>
  <path class="arrow" d="M303 852H1006"/>
  <text class="message" x="655" y="846"><tspan class="call-id">C20</tspan> Save booking reply</text>
  <path class="arrow reply" d="M303 884H110"/>
  <text class="message" x="205" y="878"><tspan class="call-id">C21</tspan> Send booking reply</text>
</svg>
