<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-labelledby="title desc">
  <title id="title">Como o “1” vira 14h</title>
  <desc id="desc">A oferta anterior incluía a opção 1 às 14h e a opção 2 às 16h. O Redis tem o checkpoint e o PostgreSQL guarda sua referência. A seta E copia a oferta para o checkpoint da nova tentativa. No turno atual, a seta F mostra select lendo essa oferta para associar a escolha 1 às 14h.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 22px; font-weight: 700; }
    .body { font-size: 18px; fill: #35544a; }
    .option { font-size: 20px; font-weight: 700; }
    .arrow-label { font-size: 17px; font-weight: 700; fill: #35544a; }
    .arrow { fill: none; stroke: #537568; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="720" height="436" rx="20" fill="#fbfaf5"/>
  <text class="title" x="30" y="45">Como o “1” vira 14h</text>
  <text class="body" x="30" y="74">A oferta atravessa dois turnos do mesmo chat.</text>

  <rect x="30" y="95" width="660" height="126" rx="13" fill="#fffefa" stroke="#a4b8a8"/>
  <text class="heading" x="52" y="130">Turno anterior</text>
  <text class="body" x="52" y="159">Redis guarda a oferta.</text>
  <text class="body" x="52" y="187">PostgreSQL guarda a referência.</text>
  <rect x="429" y="134" width="108" height="54" rx="8" fill="#e0edd8" stroke="#86a57e"/>
  <text class="option" x="483" y="168" text-anchor="middle">1 · 14h</text>
  <rect x="553" y="134" width="108" height="54" rx="8" fill="#f1f5ec" stroke="#a4b8a8"/>
  <text class="option" x="607" y="168" text-anchor="middle">2 · 16h</text>

  <path class="arrow" d="M67 222v53m-6-7 6 7 6-7"/>
  <text class="arrow-label" x="90" y="253">E · O worker copia a oferta</text>

  <rect x="30" y="276" width="660" height="136" rx="13" fill="#edf3e7" stroke="#86a57e"/>
  <text class="heading" x="52" y="310">Turno atual · cliente envia “1”</text>
  <rect x="52" y="327" width="237" height="63" rx="8" fill="#fffefa" stroke="#a4b8a8"/>
  <text class="arrow-label" x="67" y="353">Checkpoint da tentativa</text>
  <text class="body" x="67" y="377">Cópia da oferta anterior</text>

  <path class="arrow" d="M289 359h174m-7-6 7 6-7 6"/>
  <text class="arrow-label" x="375" y="345" text-anchor="middle">F · select()</text>

  <rect x="464" y="327" width="197" height="63" rx="8" fill="#e0edd8" stroke="#86a57e"/>
  <text class="body" x="482" y="365">Opção 1</text>
  <text class="heading" x="640" y="366" text-anchor="end">14h</text>
</svg>
