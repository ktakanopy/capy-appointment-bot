<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="723" viewBox="0 0 1120 723" role="img" aria-labelledby="title description">
  <title id="title">Confirm, cancel or reschedule a booking</title>
  <desc id="description">The workflow calls the booking service with the appointment, customer and retry key. In one PostgreSQL transaction, the service locks the business, checks the retry key and locks a booking scoped to that business and customer. A matching retry returns the current booking and saved outcome. Otherwise confirmation updates status, cancellation also cancels the pending reminder, or rescheduling revalidates the slot and updates the booking and reminder. On success, the service saves the outcome and commits before returning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#365f51"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 32px; font-weight: 700; }
    .caption { font-size: 15px; fill: #426057; }
    .actor { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .heading { font-size: 19px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 700; }
    .message { font-size: 16px; text-anchor: middle; }
    .call-id { fill: #275343; font-weight: 700; }
    .lifeline { fill: none; stroke: #9aad9f; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #365f51; stroke-width: 1.8; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
    .alternative { fill: #fffef9; stroke: #b2c0a7; }
  </style>

  <rect width="1120" height="723" rx="20" fill="#fbfaf5"/>
  <text class="title" x="28" y="49">Confirm, cancel or reschedule a booking</text>
  <text class="caption" x="28" y="76">Solid arrows show requests or writes. Dashed arrows show results.</text>

  <rect x="445" y="201" width="644" height="456" rx="13" fill="#e4efdf" stroke="#8baa86"/>
  <rect x="465" y="328" width="604" height="55" rx="8" fill="#fbefd5" stroke="#c5a268"/>
  <rect class="alternative" x="465" y="394" width="604" height="184" rx="8"/>
  <path d="M465 456H1069 M465 514H1069" stroke="#ccd6c8" stroke-dasharray="4 3"/>

  <path class="lifeline" d="M128 144V697 M535 144V697 M1005 144V697"/>
  <g fill="#e4efdf" stroke="#8baa86">
    <rect x="34" y="97" width="188" height="47" rx="9"/>
    <rect x="446" y="97" width="178" height="47" rx="9"/>
  </g>
  <rect x="926" y="97" width="158" height="47" rx="9" fill="#e4eff0" stroke="#8ba8ac"/>
  <text class="actor" x="128" y="127">LangGraph workflow</text>
  <text class="actor" x="535" y="127">Booking service</text>
  <text class="actor" x="1005" y="127">PostgreSQL</text>

  <path class="arrow" d="M128 178H533"/>
  <text class="message" x="332" y="172"><tspan class="call-id">M01</tspan> Request a booking change</text>

  <text class="heading" x="565" y="229">Booking transaction</text>
  <path class="arrow" d="M535 271H1003"/>
  <text class="message" x="770" y="264"><tspan class="call-id">M02</tspan> Lock business and check the retry key and hash</text>
  <path class="arrow" d="M535 311H1003"/>
  <text class="message" x="770" y="304"><tspan class="call-id">M03</tspan> Lock the booking scoped to business and customer</text>
  <text class="label" x="565" y="349">Matching retry</text>
  <text class="caption" x="565" y="370">Return the current owned booking with the saved outcome.</text>

  <text class="label" x="565" y="415">New request · Confirm</text>
  <path class="arrow" d="M535 444H1003"/>
  <text class="message" x="770" y="438"><tspan class="call-id">M04</tspan> Set status to confirmed</text>

  <text class="label" x="565" y="476">New request · Cancel</text>
  <path class="arrow" d="M535 502H1003"/>
  <text class="message" x="770" y="496"><tspan class="call-id">M05</tspan> Cancel the booking and any pending reminder</text>

  <text class="label" x="565" y="534">New request · Reschedule</text>
  <path class="arrow" d="M535 563H1003"/>
  <text class="message" x="770" y="557"><tspan class="call-id">M06</tspan> Recheck slot and move booking and reminder</text>

  <path class="arrow" d="M535 613H1003"/>
  <text class="message" x="770" y="607"><tspan class="call-id">M07</tspan> Save the outcome for a new request</text>
  <path class="arrow" d="M535 645H1003"/>
  <text class="message" x="770" y="639"><tspan class="call-id">M08</tspan> Commit</text>
  <path class="arrow reply" d="M535 691H130"/>
  <text class="message" x="332" y="684"><tspan class="call-id">M09</tspan> Return owned booking and outcome</text>
</svg>
