<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Creating a booking from Telegram</title>
  <desc id="description">The webhook stores the update before acknowledging it. A worker resolves the linked customer and reads availability. After the customer picks a slot, the booking transaction locks the business and checks the retry key, locks the professional and revalidates the slot, and commits the booking, pending reminder and idempotency record. The Telegram worker saves and sends the reply. Separately, the reminder worker claims due jobs and writes the demo inbox row and delivered status together.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#536b64"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 34px; font-weight: 700; }
    .heading { font-size: 21px; font-weight: 700; }
    .detail { font-size: 16px; fill: #354d44; }
    .phase { fill: #fffef9; stroke: #b2c0a7; stroke-width: 1.5; }
    .card { stroke-width: 1.5; }
    .read { fill: #e4eff0; stroke: #8ba8ac; }
    .write { fill: #e4efdf; stroke: #8baa86; }
    .delivery { fill: #fbefd5; stroke: #c5a268; }
    .link { fill: none; stroke: #536b64; stroke-width: 2; marker-end: url(#arrow); }
  </style>

  <rect width="1000" height="620" rx="20" fill="#fbfaf5"/>
  <text class="title" x="32" y="53">Creating a booking from Telegram</text>

  <rect class="phase" x="32" y="232" width="936" height="204" rx="14"/>
  <text class="heading" x="50" y="260">PostgreSQL booking transaction</text>

  <path class="link" d="M 326 138 H 351"/>
  <path class="link" d="M 648 138 H 673"/>
  <path class="link" d="M 822 187 V 278"/>
  <path class="link" d="M 680 332 H 638"/>
  <path class="link" d="M 363 332 H 321"/>
  <path class="link" d="M 184 385 V 489"/>
  <path class="link" d="M 184 463 H 500 V 489"/>
  <path class="link" d="M 648 540 H 673"/>
  <circle cx="184" cy="463" r="4" fill="#536b64"/>

  <g class="card read">
    <rect x="32" y="91" width="292" height="94" rx="10"/>
    <rect x="354" y="91" width="292" height="94" rx="10"/>
    <rect x="676" y="91" width="292" height="94" rx="10"/>
  </g>
  <g class="card write">
    <rect x="49" y="280" width="270" height="103" rx="10"/>
    <rect x="365" y="280" width="270" height="103" rx="10"/>
    <rect x="682" y="280" width="270" height="103" rx="10"/>
  </g>
  <g class="card delivery">
    <rect x="32" y="492" width="292" height="96" rx="10"/>
    <rect x="354" y="492" width="292" height="96" rx="10"/>
    <rect x="676" y="492" width="292" height="96" rx="10"/>
  </g>

  <text class="heading" x="48" y="120">Receive a Telegram update</text>
  <text class="detail" x="48" y="144">Save the update receipt</text>
  <text class="detail" x="48" y="164">before acknowledging the webhook.</text>

  <text class="heading" x="370" y="120">Resolve the customer</text>
  <text class="detail" x="370" y="144">Look up the sender’s linked customer</text>
  <text class="detail" x="370" y="164">or create and link a new record.</text>

  <text class="heading" x="692" y="120">Offer available times</text>
  <text class="detail" x="692" y="144">Read working hours, blocks and</text>
  <text class="detail" x="692" y="164">active bookings for eligible staff.</text>
  <text class="detail" x="806" y="215" text-anchor="end">Customer chooses a slot</text>

  <text class="heading" x="698" y="309">Check the retry key</text>
  <text class="detail" x="698" y="334">Lock the business row and</text>
  <text class="detail" x="698" y="355">check the request hash.</text>

  <text class="heading" x="381" y="309">Revalidate the slot</text>
  <text class="detail" x="381" y="334">Lock the professional and recheck</text>
  <text class="detail" x="381" y="355">policy and current conflicts.</text>

  <text class="heading" x="65" y="309">Commit the booking</text>
  <text class="detail" x="65" y="334">Save the booking, pending</text>
  <text class="detail" x="65" y="355">reminder and retry record.</text>
  <text class="detail" x="365" y="415">A matching retry reuses the booking. An invalid slot aborts the write.</text>

  <text class="heading" x="48" y="521">Save and send the reply</text>
  <text class="detail" x="48" y="546">Persist the reply first so delivery</text>
  <text class="detail" x="48" y="566">can retry from the saved response.</text>

  <text class="heading" x="370" y="521">Claim due reminders</text>
  <text class="detail" x="370" y="546">The reminder worker claims due</text>
  <text class="detail" x="370" y="566">rows with SKIP LOCKED.</text>

  <text class="heading" x="692" y="521">Deliver to the demo inbox</text>
  <text class="detail" x="692" y="546">Insert the inbox entry and mark</text>
  <text class="detail" x="692" y="566">the reminder delivered together.</text>
</svg>
