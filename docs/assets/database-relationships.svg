<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="690" viewBox="0 0 1170 690" role="img" aria-labelledby="title desc">
  <title id="title">Studio database relationships</title>
  <desc id="desc">Foreign keys in the studio tables point to primary or unique keys. The professional business index allows at most one professional per business.</desc>
  <style>
text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #536d60; }
.name { font: 700 17px ui-monospace, Menlo, monospace; fill: #173f32; }
.field { font: 14px ui-monospace, Menlo, monospace; fill: #314a40; }
.label { font-size: 14px; fill: #536d60; }
.key { font-size: 13px; font-weight: 700; fill: #5e6e91; }
</style>
  <rect width="1170" height="690" rx="20" fill="#fbfaf5"/>
  <text x="30" y="44" class="title">Studio table relationships</text>
  <text x="30" y="71" class="subtitle">Each arrow points from a foreign key to the row it references.</text>
  <rect x="30" y="93" width="1110" height="50" rx="10" fill="#e8f2e8"/>
  <text x="48" y="124" class="key">FOREIGN KEY</text>
  <text x="570" y="124" class="key">REFERENCED KEY</text>
  <text x="815" y="124" class="key">CARDINALITY</text>
  <rect x="30" y="143" width="1110" height="49" fill="#fffefa"/>
  <text x="48" y="173" class="field">professionals.business_id</text>
  <text x="570" y="173" class="field">businesses.id</text>
  <text x="815" y="173" class="label">at most one per business</text>
  <path d="M510 168 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="192" width="1110" height="49" fill="#f5f8f3"/>
  <text x="48" y="222" class="field">services.business_id</text>
  <text x="570" y="222" class="field">businesses.id</text>
  <text x="815" y="222" class="label">one business · many services</text>
  <path d="M510 217 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="241" width="1110" height="49" fill="#fffefa"/>
  <text x="48" y="271" class="field">customers.business_id</text>
  <text x="570" y="271" class="field">businesses.id</text>
  <text x="815" y="271" class="label">one business · many customers</text>
  <path d="M510 266 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="290" width="1110" height="49" fill="#f5f8f3"/>
  <text x="48" y="320" class="field">weekly_availability_rules.professional_id</text>
  <text x="570" y="320" class="field">professionals.id</text>
  <text x="815" y="320" class="label">one massagista · many rules</text>
  <path d="M510 315 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="339" width="1110" height="49" fill="#fffefa"/>
  <text x="48" y="369" class="field">blocked_periods.professional_id</text>
  <text x="570" y="369" class="field">professionals.id</text>
  <text x="815" y="369" class="label">one massagista · many blocks</text>
  <path d="M510 364 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="388" width="1110" height="49" fill="#f5f8f3"/>
  <text x="48" y="418" class="field">bookings (professional_id, business_id)</text>
  <text x="570" y="418" class="field">professionals (id, business_id)</text>
  <text x="855" y="418" class="label">one professional · many bookings</text>
  <path d="M510 413 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="437" width="1110" height="49" fill="#fffefa"/>
  <text x="48" y="467" class="field">bookings (service_id, business_id)</text>
  <text x="570" y="467" class="field">services (id, business_id)</text>
  <text x="815" y="467" class="label">one service · many bookings</text>
  <path d="M510 462 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="486" width="1110" height="49" fill="#f5f8f3"/>
  <text x="48" y="516" class="field">bookings (customer_id, business_id)</text>
  <text x="570" y="516" class="field">customers (id, business_id)</text>
  <text x="815" y="516" class="label">one customer · many bookings</text>
  <path d="M510 511 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="535" width="1110" height="49" fill="#fffefa"/>
  <text x="48" y="565" class="field">bookings.business_id</text>
  <text x="570" y="565" class="field">businesses.id</text>
  <text x="815" y="565" class="label">one business · many bookings</text>
  <path d="M510 560 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <rect x="30" y="584" width="1110" height="49" fill="#f5f8f3"/>
  <text x="48" y="614" class="field">idempotency_records.business_id</text>
  <text x="570" y="614" class="field">businesses.id</text>
  <text x="815" y="614" class="label">one business · many retry records</text>
  <path d="M510 609 h33 m-7 -6 7 6 -7 6" fill="none" stroke="#31785a" stroke-width="2"/>
  <text x="30" y="666" class="subtitle">Availability rules and blocks also reference businesses.id.  ·  PK and FK fields are shown in the next diagram.</text>
</svg>
