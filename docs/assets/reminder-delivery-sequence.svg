<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="866" viewBox="0 0 1120 866" role="img" aria-labelledby="title description">
  <title id="title">Deliver an appointment reminder</title>
  <desc id="description">The booking service saves a pending reminder with the appointment. In a later transaction the reminder worker locks due pending jobs, skipping locked rows, then reads the booking and business time zone. The worker cancels the job for a missing or canceled booking. Otherwise it writes one demo inbox entry and marks the job delivered together. If delivery fails, the worker rolls back the attempt and records either a new due time in 30 seconds or a terminal failure on the third attempt. After the batch commits, the owner CLI can read the demo inbox.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#365f51"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19362d; }
    .title { font-size: 32px; font-weight: 700; }
    .caption { font-size: 15px; fill: #426057; }
    .actor { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .heading { font-size: 19px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 700; }
    .message { font-size: 16px; text-anchor: middle; }
    .call-id { fill: #275343; font-weight: 700; }
    .lifeline { fill: none; stroke: #9aad9f; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #365f51; stroke-width: 1.8; marker-end: url(#arrow); }
    .reply { stroke-dasharray: 5 4; }
    .over-lifeline { paint-order: stroke; stroke: #f1f4eb; stroke-width: 5px; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="866" rx="20" fill="#fbfaf5"/>
  <text class="title" x="28" y="49">Deliver an appointment reminder</text>
  <text class="caption" x="28" y="76">Solid arrows show requests or writes. Dashed arrows show results.</text>

  <rect x="28" y="160" width="1064" height="103" rx="13" fill="#f1f4eb"/>
  <rect x="319" y="280" width="535" height="463" rx="13" fill="#e4efdf" stroke="#8baa86"/>
  <rect x="338" y="457" width="497" height="237" rx="8" fill="#fffef9" stroke="#b2c0a7"/>
  <rect x="28" y="759" width="1064" height="79" rx="13" fill="#f1f4eb"/>
  <path d="M338 519H835 M338 613H835" stroke="#ccd6c8" stroke-dasharray="4 3"/>

  <path class="lifeline" d="M120 144V829 M390 144V829 M780 144V829 M1000 144V829"/>
  <g fill="#e4efdf" stroke="#8baa86">
    <rect x="31" y="97" width="178" height="47" rx="9"/>
    <rect x="299" y="97" width="182" height="47" rx="9"/>
    <rect x="921" y="97" width="158" height="47" rx="9"/>
  </g>
  <rect x="701" y="97" width="158" height="47" rx="9" fill="#e4eff0" stroke="#8ba8ac"/>
  <text class="actor" x="120" y="127">Booking service</text>
  <text class="actor" x="390" y="127">Reminder worker</text>
  <text class="actor" x="780" y="127">PostgreSQL</text>
  <text class="actor" x="1000" y="127">Owner CLI</text>

  <text class="heading over-lifeline" x="46" y="187">Booking transaction</text>
  <path class="arrow" d="M120 218H778"/>
  <text class="message over-lifeline" x="450" y="211"><tspan class="call-id">R01</tspan> Save the appointment and a pending reminder with its due time</text>
  <path class="arrow" d="M120 248H778"/>
  <text class="message" x="450" y="241"><tspan class="call-id">R02</tspan> Commit the booking</text>

  <text class="heading" x="416" y="306">Reminder worker transaction</text>
  <path class="arrow" d="M390 346H778"/>
  <text class="message" x="585" y="339"><tspan class="call-id">R03</tspan> Select due jobs and skip locked rows</text>
  <path class="arrow reply" d="M780 376H392"/>
  <text class="message" x="585" y="369"><tspan class="call-id">R04</tspan> Return locked jobs</text>
  <path class="arrow" d="M390 412H778"/>
  <text class="message" x="585" y="405"><tspan class="call-id">R05</tspan> Load the booking and business time zone</text>
  <path class="arrow reply" d="M780 442H392"/>
  <text class="message" x="585" y="435"><tspan class="call-id">R06</tspan> Return current booking details</text>

  <text class="label" x="416" y="479">For each job · Booking missing or canceled</text>
  <path class="arrow" d="M390 507H778"/>
  <text class="message" x="585" y="500"><tspan class="call-id">R07</tspan> Mark the reminder canceled</text>

  <text class="label" x="416" y="541">For each job · Successful delivery</text>
  <path class="arrow" d="M390 570H778"/>
  <text class="message" x="585" y="563"><tspan class="call-id">R08</tspan> Insert the demo inbox message</text>
  <path class="arrow" d="M390 601H778"/>
  <text class="message" x="585" y="594"><tspan class="call-id">R09</tspan> Mark the reminder delivered</text>

  <text class="label" x="416" y="635">For each job · Delivery attempt fails</text>
  <path class="arrow" d="M390 663H778"/>
  <text class="message" x="585" y="656"><tspan class="call-id">R10</tspan> Roll back the attempt and record the failure</text>
  <text class="caption" x="416" y="684">Retry in 30 seconds or stop at the third failure.</text>

  <path class="arrow" d="M390 729H778"/>
  <text class="message" x="585" y="722"><tspan class="call-id">R11</tspan> Commit the batch</text>

  <path class="arrow" d="M1000 789H782"/>
  <text class="message" x="890" y="782"><tspan class="call-id">R12</tspan> Read the demo inbox</text>
  <path class="arrow reply" d="M780 821H998"/>
  <text class="message" x="890" y="814"><tspan class="call-id">R13</tspan> Return inbox messages</text>
</svg>
