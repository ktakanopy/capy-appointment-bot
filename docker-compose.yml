services:
  app-postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-scheduling} -d ${APP_POSTGRES_DB:-scheduling}"]
      interval: 3s
      timeout: 3s
      retries: 15
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-scheduling}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-scheduling}
      POSTGRES_DB: ${APP_POSTGRES_DB:-scheduling}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  chat-redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - app_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    restart: unless-stopped
    build:
      context: .
    command: sh -c "alembic upgrade head && python -m app.seed && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-scheduling}:${APP_POSTGRES_PASSWORD:-scheduling}@app-postgres:5432/${APP_POSTGRES_DB:-scheduling}
      DEMO_BUSINESS_ID: ${DEMO_BUSINESS_ID:-demo-studio}
      UNDERSTANDING_PROVIDER: gemma
      DECISION_PROVIDER: laya
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://host.docker.internal:8081}
      LAYA_BASE_URL: ${LAYA_BASE_URL:-http://host.docker.internal:8082}
      CHAT_REDIS_URL: redis://chat-redis:6379/0
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-lf_pk_local_dev_key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-lf_sk_local_dev_key}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
    depends_on:
      app-postgres:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  reminder-worker:
    restart: unless-stopped
    build:
      context: .
    command: python -m app.reminders --poll-seconds 2
    environment:
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-scheduling}:${APP_POSTGRES_PASSWORD:-scheduling}@app-postgres:5432/${APP_POSTGRES_DB:-scheduling}
    depends_on:
      api:
        condition: service_healthy

  telegram-worker:
    profiles: ["telegram"]
    restart: unless-stopped
    build:
      context: .
    command: python -m app.telegram_worker
    environment:
      DATABASE_URL: postgresql://${APP_POSTGRES_USER:-scheduling}:${APP_POSTGRES_PASSWORD:-scheduling}@app-postgres:5432/${APP_POSTGRES_DB:-scheduling}
      DEMO_BUSINESS_ID: ${DEMO_BUSINESS_ID:-demo-studio}
      CHAT_REDIS_URL: redis://chat-redis:6379/0
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      UNDERSTANDING_PROVIDER: gemma
      DECISION_PROVIDER: laya
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://host.docker.internal:8081}
      LAYA_BASE_URL: ${LAYA_BASE_URL:-http://host.docker.internal:8082}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-20}
      TELEGRAM_AUDIO_MAX_BYTES: ${TELEGRAM_AUDIO_MAX_BYTES:-20000000}
      TELEGRAM_AUDIO_MAX_DECODED_BYTES: ${TELEGRAM_AUDIO_MAX_DECODED_BYTES:-536870912}
      TELEGRAM_AUDIO_DECODE_TIMEOUT_SECONDS: ${TELEGRAM_AUDIO_DECODE_TIMEOUT_SECONDS:-120}
      TELEGRAM_AUDIO_CHUNK_TIMEOUT_SECONDS: ${TELEGRAM_AUDIO_CHUNK_TIMEOUT_SECONDS:-60}
      TELEGRAM_AUDIO_PROCESSING_TIMEOUT_SECONDS: ${TELEGRAM_AUDIO_PROCESSING_TIMEOUT_SECONDS:-900}
    depends_on:
      api:
        condition: service_healthy

volumes:
  app_postgres_data:
  app_redis_data:
