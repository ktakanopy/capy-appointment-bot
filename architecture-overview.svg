<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 763" width="1430" height="763" role="img" aria-label="CAPY architecture · Current runtime">
  <title>CAPY architecture · Current runtime</title>
  <desc>Save Telegram messages in PostgreSQL, process them with five workers, and send replies through one separate sender.</desc>
  <rect x="0" y="0" width="1430" height="763" rx="0" fill="#f5f8fa" stroke="none" stroke-width="1" />
  <text x="40" y="56" fill="#172e3b" font-size="35" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CAPY architecture · Current runtime</text>
  <text x="42" y="89" fill="#466072" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Save Telegram messages in PostgreSQL, process them with five workers, and send replies through one separate sender.</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#557383" />
    </marker>
  </defs>
  <rect x="40" y="123" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <rect x="40" y="320" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <rect x="40" y="517" width="1350" height="157" rx="12" fill="#edf3f6" stroke="#c8d7df" stroke-width="1" />
  <polyline points="468.6666666666667,214.5 508.6666666666667,214.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-telegram" data-to="ov-api" data-kind="flow" />
  <polyline points="921.3333333333334,214.5 961.3333333333334,214.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-api" data-to="ov-inbox" data-kind="flow" />
  <polyline points="715.0,264 715.0,313.0 262.33333333333337,313.0 262.33333333333337,362" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-api" data-to="ov-rabbit" data-kind="async" stroke-dasharray="6 5" />
  <polyline points="468.6666666666667,411.5 508.6666666666667,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-rabbit" data-to="ov-processors" data-kind="async" stroke-dasharray="6 5" />
  <polyline points="1167.6666666666667,264 1167.6666666666667,313.0 715.0,313.0 715.0,362" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-inbox" data-to="ov-processors" data-kind="flow" />
  <polyline points="262.33333333333337,559 262.33333333333337,510.0 715.0,510.0 715.0,461" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-recovery" data-to="ov-processors" data-kind="flow" />
  <polyline points="921.3333333333334,411.5 961.3333333333334,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-processors" data-to="ov-outbox" data-kind="flow" />
  <polyline points="1167.6666666666667,461 1167.6666666666667,510.0 715.0,510.0 715.0,559" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-outbox" data-to="ov-sender" data-kind="async" stroke-dasharray="6 5" />
  <polyline points="921.3333333333334,608.5 961.3333333333334,608.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="ov-sender" data-to="ov-reply" data-kind="flow" />
  <rect x="55" y="131" width="319" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="149" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Receive and save the customer's message</text>
  <g id="ov-telegram" data-source="app/main.py#telegram_webhook">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/main.py#L101">
      <title>telegram_webhook · app/main.py:101</title>
      <rect x="56.0" y="165" width="412.6666666666667" height="99" rx="12" fill="#e5f3fc" stroke="#397a9e" stroke-width="1.4" />
      <text x="68.0" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Customer sends a message</text>
      <text x="68.0" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">main.py:101</text>
      <text x="68.0" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Telegram sends the customer's private text, voice</text>
      <text x="68.0" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">message or shared contact to CAPY.</text>
    </a>
  </g>
  <g id="ov-api" data-source="app/main.py#telegram_webhook">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/main.py#L101">
      <title>telegram_webhook · app/main.py:101</title>
      <rect x="508.6666666666667" y="165" width="412.6666666666667" height="99" rx="12" fill="#e5f3fc" stroke="#397a9e" stroke-width="1.4" />
      <text x="520.6666666666667" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Receive and save the message</text>
      <text x="520.6666666666667" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">main.py:101</text>
      <text x="520.6666666666667" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The API checks the webhook secret and saves the update</text>
      <text x="520.6666666666667" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">before notifying a processor.</text>
    </a>
  </g>
  <g id="ov-inbox" data-source="app/channels/telegram_intake.py#save_update">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_intake.py#L48">
      <title>save_update · app/channels/telegram_intake.py:48</title>
      <rect x="961.3333333333334" y="165" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="973.3333333333334" y="189" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Saved incoming messages</text>
      <text x="973.3333333333334" y="208" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_intake.py:48</text>
      <text x="973.3333333333334" y="227" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">PostgreSQL stores each accepted update and whether it</text>
      <text x="973.3333333333334" y="242" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">still needs processing.</text>
    </a>
  </g>
  <rect x="55" y="328" width="303" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="346" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Notify processors and handle messages</text>
  <g id="ov-rabbit" data-source="app/channels/telegram_queue.py#TelegramQueue">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_queue.py#L48">
      <title>TelegramQueue · app/channels/telegram_queue.py:48</title>
      <rect x="56.0" y="362" width="412.6666666666667" height="99" rx="12" fill="#e5f3fc" stroke="#397a9e" stroke-width="1.4" />
      <text x="68.0" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">RabbitMQ notification</text>
      <text x="68.0" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_queue.py:48</text>
      <text x="68.0" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The shared telegram.chat_ready queue carries only the</text>
      <text x="68.0" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">bot and chat IDs.</text>
    </a>
  </g>
  <g id="ov-processors" data-source="app/telegram_worker.py#process_pending">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/telegram_worker.py#L105">
      <title>process_pending · app/telegram_worker.py:105</title>
      <rect x="508.6666666666667" y="362" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="520.6666666666667" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">5 message processors</text>
      <text x="520.6666666666667" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_worker.py:105</text>
      <text x="520.6666666666667" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Each handles one message at a time. PostgreSQL allows</text>
      <text x="520.6666666666667" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">only one active processor for each chat.</text>
    </a>
  </g>
  <g id="ov-outbox" data-source="app/channels/telegram_turns.py#TelegramTurns.finish">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_turns.py#L296">
      <title>TelegramTurns.finish · app/channels/telegram_turns.py:296</title>
      <rect x="961.3333333333334" y="362" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="973.3333333333334" y="386" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Replies waiting to be sent</text>
      <text x="973.3333333333334" y="405" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_turns.py:296</text>
      <text x="973.3333333333334" y="424" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The processor saves any reply in PostgreSQL when it</text>
      <text x="973.3333333333334" y="439" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">completes the incoming message.</text>
    </a>
  </g>
  <rect x="55" y="525" width="303" height="25" rx="2" fill="#edf3f6" stroke="none" stroke-width="1" />
  <text x="56" y="543" fill="#13677e" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Find missed messages and send replies</text>
  <g id="ov-recovery" data-source="app/channels/telegram_turns.py#TelegramTurns.claim_next">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/channels/telegram_turns.py#L112">
      <title>TelegramTurns.claim_next · app/channels/telegram_turns.py:112</title>
      <rect x="56.0" y="559" width="412.6666666666667" height="99" rx="12" fill="#ffffff" stroke="#c8d7df" stroke-width="1.4" />
      <text x="68.0" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Find messages missed by the queue</text>
      <text x="68.0" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_turns.py:112</text>
      <text x="68.0" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">At startup and about once a second, each free processor</text>
      <text x="68.0" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">checks PostgreSQL for pending messages.</text>
    </a>
  </g>
  <g id="ov-sender" data-source="app/telegram_sender.py#run_sender">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/telegram_sender.py#L43">
      <title>run_sender · app/telegram_sender.py:43</title>
      <rect x="508.6666666666667" y="559" width="412.6666666666667" height="99" rx="12" fill="#e7f3f2" stroke="#548887" stroke-width="1.4" />
      <text x="520.6666666666667" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1 separate reply sender</text>
      <text x="520.6666666666667" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_sender.py:43</text>
      <text x="520.6666666666667" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">One sender reads saved replies from PostgreSQL and</text>
      <text x="520.6666666666667" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">sends them in chat order.</text>
    </a>
  </g>
  <g id="ov-reply" data-source="app/telegram_sender.py#deliver_claimed">
    <a href="https://github.com/ktakanopy/capy-appointment-bot/blob/06ac1ba45f31aef0fa938bf99acba657f94757c6/app/telegram_sender.py#L84">
      <title>deliver_claimed · app/telegram_sender.py:84</title>
      <rect x="961.3333333333334" y="559" width="412.6666666666667" height="99" rx="12" fill="#e5f3fc" stroke="#397a9e" stroke-width="1.4" />
      <text x="973.3333333333334" y="583" fill="#172e3b" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Send the reply to Telegram</text>
      <text x="973.3333333333334" y="602" fill="#13677e" font-size="12" font-weight="400" font-family="ui-monospace, Menlo, monospace">telegram_sender.py:84</text>
      <text x="973.3333333333334" y="621" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The sender calls Telegram and records success, a</text>
      <text x="973.3333333333334" y="636" fill="#466072" font-size="13" font-weight="400" font-family="system-ui, -apple-system, sans-serif">retryable failure or an uncertain result.</text>
    </a>
  </g>
  <text x="42" y="735" fill="#466072" font-size="14" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Current code. Five processors are a starting configuration, not a measured capacity claim. Open Lost notification or Independent progress for examples.</text>
</svg>