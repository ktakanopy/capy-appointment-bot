  <polyline points="468.6666666666667,411.5 508.6666666666667,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="bob-hint" data-to="bob-turn" data-kind="flow" />
  <polyline points="921.3333333333334,411.5 961.3333333333334,411.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="bob-turn" data-to="bob-finish" data-kind="flow" />
  <polyline points="468.6666666666667,608.5 508.6666666666667,608.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="progress-ready" data-to="progress-lock" data-kind="flow" />
  <polyline points="921.3333333333334,608.5 961.3333333333334,608.5" stroke="#557383" stroke-width="2" fill="none" marker-end="url(#arrow)" data-from="progress-lock" data-to="progress-send" data-kind="flow" />
