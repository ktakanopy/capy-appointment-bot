<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 763" width="1430" height="763" role="img" aria-label="Independent progress · Alice waits, Bob continues, replies are sent">
  <title>Independent progress · Alice waits, Bob continues, replies are sent</title>
  <desc>A slow model response occupies Alice's processor. Another processor serves Bob, while the sender delivers a reply saved earlier.</desc>
  <rect x="0" y="0" width="1430" height="763" rx="0" fill="#f5f8fa" stroke="none" stroke-width="1" />
  <text x="40" y="56" fill="#172e3b" font-size="35" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Independent progress · Alice waits, Bob continues, replies are sent</text>
  <text x="42" y="89" fill="#466072" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">A slow model response occupies Alice's processor. Another processor serves Bob, while the sender delivers a reply saved earlier.</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#557383" />
    </marker>
  </defs>
